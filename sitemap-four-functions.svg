<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-label="สถานะสี่ฟังก์ชันหลัก">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#e8e8e4"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#16251d" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #ffffff; }
      .grid { fill: url(#dot-grid); }
      .line { fill: none; stroke: #77766f; stroke-width: 3; stroke-linecap: square; }
      .box { stroke-width: 2; rx: 8; filter: url(#shadow); }
      .owner { fill: #fff2c9; stroke: #c5b680; }
      .done { fill: #a9d98e; stroke: #6faa54; }
      .alert { fill: #ffc5c5; stroke: #dc4c4c; }
      .txt { font-family: Tahoma, "Leelawadee UI", sans-serif; fill: #302d28; text-anchor: middle; dominant-baseline: middle; }
      .owner-text { font-size: 30px; font-weight: 700; }
      .function-text { font-size: 26px; font-weight: 700; }
      .legend-text { font-size: 24px; text-anchor: start; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="650"/>
  <rect class="grid" width="1600" height="650"/>

  <rect class="box owner" x="680" y="55" width="240" height="72"/>
  <text class="txt owner-text" x="800" y="91">เจ้าของร้าน</text>

  <path class="line" d="M800 127 V205 M205 205 H1395 M205 205 V295 M595 205 V295 M1005 205 V295 M1395 205 V295"/>

  <rect class="box alert" x="55" y="295" width="300" height="105"/>
  <text class="txt function-text" x="205" y="347.5">คำสั่งซื้อสินค้าคงคลัง</text>

  <rect class="box alert" x="430" y="295" width="330" height="105"/>
  <text class="txt function-text" x="595" y="347.5">ระบบแนะนำการสั่งซื้อ</text>

  <rect class="box done" x="825" y="295" width="360" height="105"/>
  <text class="txt function-text" x="1005" y="347.5">บัญชีขายเชื่อ &amp; ลูกค้าประจำ</text>

  <rect class="box done" x="1235" y="295" width="320" height="105"/>
  <text class="txt function-text" x="1395" y="347.5">จัดการบัญชีพนักงาน</text>

  <circle cx="555" cy="525" r="23" fill="#a9d98e" stroke="#6faa54" stroke-width="2"/>
  <text class="txt legend-text" x="600" y="525">เสร็จและตรวจสอบแล้ว</text>

  <circle cx="955" cy="525" r="23" fill="#ffc5c5" stroke="#dc4c4c" stroke-width="2"/>
  <text class="txt legend-text" x="1000" y="525">ยังไม่เสร็จดีหรือยังตรวจสอบไม่ครบ</text>
</svg>
