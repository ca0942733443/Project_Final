<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1780" viewBox="0 0 2400 1780" role="img" aria-label="แผนผังทุกฟังก์ชันในสี่หมวดหลัก">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#e8e8e4"/>
    </pattern>
    <style>
      .bg { fill: #fff; }
      .grid { fill: url(#dot-grid); }
      .line { fill: none; stroke: #77766f; stroke-width: 2.5; stroke-linecap: square; }
      .panel { fill: rgba(255,255,255,.82); stroke: #c8c6be; stroke-width: 1.5; rx: 8; }
      .box { stroke-width: 1.6; rx: 3; }
      .owner { fill: #fff2c9; stroke: #c6b77e; }
      .header { fill: #fff; stroke: #aaa89f; }
      .done { fill: #a9d98e; stroke: #78b25d; }
      .alert { fill: #ffc5c5; stroke: #dc4c4c; }
      .txt { font-family: Tahoma, "Leelawadee UI", sans-serif; fill: #302d28; text-anchor: middle; dominant-baseline: middle; }
      .owner-text { font-size: 30px; font-weight: 700; }
      .header-text { font-size: 24px; font-weight: 700; }
      .task-text { font-size: 17px; }
      .legend-text { font-size: 23px; text-anchor: start; }
    </style>
  </defs>

  <rect class="bg" width="2400" height="1780"/>
  <rect class="grid" width="2400" height="1780"/>

  <rect class="box owner" x="1090" y="38" width="220" height="66"/>
  <text class="txt owner-text" x="1200" y="71">เจ้าของร้าน</text>
  <path class="line" d="M1200 104 V165 M300 165 H2100 M300 165 V220 M900 165 V220 M1500 165 V220 M2100 165 V220"/>

  <!-- คำสั่งซื้อสินค้าคงคลัง -->
  <g transform="translate(35 220)">
    <rect class="panel" x="0" y="0" width="530" height="1320"/>
    <rect class="box header" x="15" y="14" width="500" height="62"/>
    <text class="txt header-text" x="265" y="45">คำสั่งซื้อสินค้าคงคลัง</text>

    <rect class="box done" x="35" y="96" width="460" height="46"/><text class="txt task-text" x="265" y="119">แสดงสรุปจำนวนตามสถานะ</text>
    <rect class="box done" x="35" y="154" width="460" height="46"/><text class="txt task-text" x="265" y="177">ค้นหาคำสั่งซื้อ</text>
    <rect class="box done" x="35" y="212" width="460" height="46"/><text class="txt task-text" x="265" y="235">กรองคำสั่งซื้อตามสถานะ</text>
    <rect class="box done" x="35" y="270" width="460" height="46"/><text class="txt task-text" x="265" y="293">รีเฟรชรายการและแบ่งหน้า</text>
    <rect class="box done" x="35" y="328" width="460" height="46"/><text class="txt task-text" x="265" y="351">สร้างคำสั่งซื้อ</text>
    <rect class="box done" x="35" y="386" width="460" height="46"/><text class="txt task-text" x="265" y="409">ค้นหา/กรองสินค้า หมวดหมู่ และ Supplier</text>
    <rect class="box done" x="35" y="444" width="460" height="46"/><text class="txt task-text" x="265" y="467">พักหรือนำสินค้าออกจากรายการ</text>
    <rect class="box done" x="35" y="502" width="460" height="46"/><text class="txt task-text" x="265" y="525">แก้จำนวนสั่งซื้อและบันทึกหมายเหตุ</text>
    <rect class="box done" x="35" y="560" width="460" height="46"/><text class="txt task-text" x="265" y="583">ล้างรายการพักทั้งหมด</text>
    <rect class="box done" x="35" y="618" width="460" height="46"/><text class="txt task-text" x="265" y="641">แยกใบสั่งซื้อตาม Supplier</text>
    <rect class="box done" x="35" y="676" width="460" height="46"/><text class="txt task-text" x="265" y="699">ดูรายละเอียดคำสั่งซื้อ</text>
    <rect class="box done" x="35" y="734" width="460" height="46"/><text class="txt task-text" x="265" y="757">ดู สลับ และพิมพ์ใบ PO</text>
    <rect class="box done" x="35" y="792" width="460" height="46"/><text class="txt task-text" x="265" y="815">ส่งคำสั่งซื้อเพื่อขออนุมัติ</text>
    <rect class="box done" x="35" y="850" width="460" height="46"/><text class="txt task-text" x="265" y="873">อนุมัติ ไม่อนุมัติ หรือคืนเป็นฉบับร่าง</text>
    <rect class="box done" x="35" y="908" width="460" height="46"/><text class="txt task-text" x="265" y="931">ตรวจรับสินค้าเข้าสต็อก</text>
    <rect class="box done" x="35" y="966" width="460" height="46"/><text class="txt task-text" x="265" y="989">บันทึกจำนวนรับจริง ต้นทุน และราคาขาย</text>
    <rect class="box done" x="35" y="1024" width="460" height="46"/><text class="txt task-text" x="265" y="1047">บันทึกเลขล็อตและวันหมดอายุ</text>
    <rect class="box done" x="35" y="1082" width="460" height="46"/><text class="txt task-text" x="265" y="1105">เพิ่มสต็อกและบันทึกความเคลื่อนไหว</text>
    <rect class="box alert" x="35" y="1140" width="460" height="46"/><text class="txt task-text" x="265" y="1163">แก้ไขรายการสินค้าหลังสร้างคำสั่งซื้อ</text>
    <rect class="box alert" x="35" y="1198" width="460" height="46"/><text class="txt task-text" x="265" y="1221">ลบคำสั่งซื้อ</text>
  </g>

  <!-- ระบบแนะนำการสั่งซื้อ -->
  <g transform="translate(635 220)">
    <rect class="panel" x="0" y="0" width="530" height="1320"/>
    <rect class="box header" x="15" y="14" width="500" height="62"/>
    <text class="txt header-text" x="265" y="45">ระบบแนะนำการสั่งซื้อ</text>

    <rect class="box done" x="35" y="96" width="460" height="46"/><text class="txt task-text" x="265" y="119">คำนวณยอดขายย้อนหลัง 7 วัน</text>
    <rect class="box done" x="35" y="154" width="460" height="46"/><text class="txt task-text" x="265" y="177">คำนวณสต็อก จุดสั่งซื้อ และเป้าสต็อก</text>
    <rect class="box done" x="35" y="212" width="460" height="46"/><text class="txt task-text" x="265" y="235">แนะนำปริมาณเติมสินค้า</text>
    <rect class="box done" x="35" y="270" width="460" height="46"/><text class="txt task-text" x="265" y="293">แนะนำลูกค้าที่ไม่ซื้อซ้ำ</text>
    <rect class="box done" x="35" y="328" width="460" height="46"/><text class="txt task-text" x="265" y="351">เลือกเกณฑ์ไม่ซื้อซ้ำ 2/3/7 วัน</text>
    <rect class="box done" x="35" y="386" width="460" height="46"/><text class="txt task-text" x="265" y="409">แสดงสินค้าที่ลูกค้าเคยซื้อ</text>
    <rect class="box done" x="35" y="444" width="460" height="46"/><text class="txt task-text" x="265" y="467">สลับมุมมองคำแนะนำสินค้า/ลูกค้า</text>
    <rect class="box done" x="35" y="502" width="460" height="46"/><text class="txt task-text" x="265" y="525">รีเฟรชคำแนะนำ</text>
    <rect class="box done" x="35" y="560" width="460" height="46"/><text class="txt task-text" x="265" y="583">ส่งออกคำแนะนำเป็น CSV</text>
    <rect class="box done" x="35" y="618" width="460" height="46"/><text class="txt task-text" x="265" y="641">พักหรือนำสินค้าออกจากรายการสั่งซื้อ</text>
    <rect class="box done" x="35" y="676" width="460" height="46"/><text class="txt task-text" x="265" y="699">เก็บรายการพักไว้ใน Session</text>
    <rect class="box done" x="35" y="734" width="460" height="46"/><text class="txt task-text" x="265" y="757">ล้างรายการพัก</text>
    <rect class="box done" x="35" y="792" width="460" height="46"/><text class="txt task-text" x="265" y="815">ตรวจสอบและสร้างใบสั่งซื้อต่อ</text>
    <rect class="box alert" x="35" y="850" width="460" height="46"/><text class="txt task-text" x="265" y="873">บันทึกสถานะเตรียมสินค้าลูกค้าแบบถาวร</text>
  </g>

  <!-- บัญชีขายเชื่อและลูกค้าประจำ -->
  <g transform="translate(1235 220)">
    <rect class="panel" x="0" y="0" width="530" height="1320"/>
    <rect class="box header" x="15" y="14" width="500" height="62"/>
    <text class="txt header-text" x="265" y="45">บัญชีขายเชื่อ &amp; ลูกค้าประจำ</text>

    <rect class="box done" x="35" y="96" width="460" height="46"/><text class="txt task-text" x="265" y="119">แสดงสรุปลูกค้า ยอดหนี้ และจำนวนบิล</text>
    <rect class="box done" x="35" y="154" width="460" height="46"/><text class="txt task-text" x="265" y="177">ส่งออกข้อมูลลูกค้าเป็น CSV</text>
    <rect class="box done" x="35" y="212" width="460" height="46"/><text class="txt task-text" x="265" y="235">เพิ่มลูกค้าใหม่</text>
    <rect class="box done" x="35" y="270" width="460" height="46"/><text class="txt task-text" x="265" y="293">บันทึกเบอร์ ทะเบียน ที่อยู่ และประเภทรถ</text>
    <rect class="box done" x="35" y="328" width="460" height="46"/><text class="txt task-text" x="265" y="351">กำหนดวงเงินขายเชื่อ</text>
    <rect class="box done" x="35" y="386" width="460" height="46"/><text class="txt task-text" x="265" y="409">แก้ไขข้อมูลลูกค้า</text>
    <rect class="box done" x="35" y="444" width="460" height="46"/><text class="txt task-text" x="265" y="467">แก้ไขวงเงินขายเชื่อ</text>
    <rect class="box done" x="35" y="502" width="460" height="46"/><text class="txt task-text" x="265" y="525">ปิดใช้งานลูกค้า</text>
    <rect class="box done" x="35" y="560" width="460" height="46"/><text class="txt task-text" x="265" y="583">ดูข้อมูลลูกค้า วงเงิน และยอดค้าง</text>
    <rect class="box done" x="35" y="618" width="460" height="46"/><text class="txt task-text" x="265" y="641">ดูรายการบิลขายเชื่อ</text>
    <rect class="box done" x="35" y="676" width="460" height="46"/><text class="txt task-text" x="265" y="699">ดูสินค้าและส่วนลดในแต่ละบิล</text>
    <rect class="box done" x="35" y="734" width="460" height="46"/><text class="txt task-text" x="265" y="757">ดูประวัติรับชำระ</text>
    <rect class="box done" x="35" y="792" width="460" height="46"/><text class="txt task-text" x="265" y="815">รีเฟรชข้อมูลบัญชีขายเชื่อ</text>
    <rect class="box done" x="35" y="850" width="460" height="46"/><text class="txt task-text" x="265" y="873">ค้นหาและเลือกลูกค้าใน POS</text>
    <rect class="box done" x="35" y="908" width="460" height="46"/><text class="txt task-text" x="265" y="931">ตรวจวงเงินคงเหลือและหนี้เกินกำหนด</text>
    <rect class="box done" x="35" y="966" width="460" height="46"/><text class="txt task-text" x="265" y="989">ขายเชื่อและสร้างใบหนี้ครบกำหนด 7 วัน</text>
    <rect class="box done" x="35" y="1024" width="460" height="46"/><text class="txt task-text" x="265" y="1047">รับชำระบางส่วนหรือทั้งหมด</text>
    <rect class="box done" x="35" y="1082" width="460" height="46"/><text class="txt task-text" x="265" y="1105">เงินสด QR หรือโอน พร้อมเลขอ้างอิง</text>
    <rect class="box done" x="35" y="1140" width="460" height="46"/><text class="txt task-text" x="265" y="1163">อัปเดตสถานะ UNPAID/PARTIAL/PAID/OVERDUE</text>
    <rect class="box done" x="35" y="1198" width="460" height="46"/><text class="txt task-text" x="265" y="1221">บันทึกรายรับจากการชำระหนี้</text>
  </g>

  <!-- จัดการบัญชีพนักงาน -->
  <g transform="translate(1835 220)">
    <rect class="panel" x="0" y="0" width="530" height="1320"/>
    <rect class="box header" x="15" y="14" width="500" height="62"/>
    <text class="txt header-text" x="265" y="45">จัดการบัญชีพนักงาน</text>

    <rect class="box done" x="35" y="96" width="460" height="46"/><text class="txt task-text" x="265" y="119">แสดงสรุปจำนวนพนักงานตามบทบาท</text>
    <rect class="box done" x="35" y="154" width="460" height="46"/><text class="txt task-text" x="265" y="177">แสดงรายชื่อและสถานะบัญชี</text>
    <rect class="box done" x="35" y="212" width="460" height="46"/><text class="txt task-text" x="265" y="235">แสดงบทบาทและเวลาเข้าสู่ระบบล่าสุด</text>
    <rect class="box done" x="35" y="270" width="460" height="46"/><text class="txt task-text" x="265" y="293">เพิ่มพนักงานใหม่</text>
    <rect class="box done" x="35" y="328" width="460" height="46"/><text class="txt task-text" x="265" y="351">ตรวจรูปแบบอีเมลและยืนยันรหัสผ่าน</text>
    <rect class="box done" x="35" y="386" width="460" height="46"/><text class="txt task-text" x="265" y="409">กำหนด Owner/Cashier/Stock</text>
    <rect class="box done" x="35" y="444" width="460" height="46"/><text class="txt task-text" x="265" y="467">โหลดข้อมูลเดิมในหน้าแก้ไข</text>
    <rect class="box done" x="35" y="502" width="460" height="46"/><text class="txt task-text" x="265" y="525">แก้ไขชื่อและอีเมล</text>
    <rect class="box done" x="35" y="560" width="460" height="46"/><text class="txt task-text" x="265" y="583">แก้ไขบทบาทและสิทธิ์</text>
    <rect class="box done" x="35" y="618" width="460" height="46"/><text class="txt task-text" x="265" y="641">เปลี่ยนรหัสผ่านใหม่แบบไม่บังคับ</text>
    <rect class="box done" x="35" y="676" width="460" height="46"/><text class="txt task-text" x="265" y="699">ปิดใช้งานบัญชีพนักงาน</text>
    <rect class="box alert" x="35" y="734" width="460" height="46"/><text class="txt task-text" x="265" y="757">เปิดใช้งานบัญชีที่ถูกปิดจากหน้ารายการ</text>
    <rect class="box alert" x="35" y="792" width="460" height="46"/><text class="txt task-text" x="265" y="815">ลบพนักงานถาวร</text>
  </g>

  <circle cx="840" cy="1655" r="22" fill="#a9d98e" stroke="#78b25d" stroke-width="2"/>
  <text class="txt legend-text" x="885" y="1655">เสร็จและตรวจสอบแล้ว</text>
  <circle cx="1340" cy="1655" r="22" fill="#ffc5c5" stroke="#dc4c4c" stroke-width="2"/>
  <text class="txt legend-text" x="1385" y="1655">ยังไม่เสร็จดีหรือยังตรวจสอบไม่ครบ</text>
</svg>
