<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="900" viewBox="0 0 2400 900" role="img" aria-label="แผนผังเว็บไซต์">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#e8e8e4"/>
    </pattern>
    <style>
      .bg { fill: #ffffff; }
      .grid { fill: url(#dot-grid); }
      .line { fill: none; stroke: #77766f; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; }
      .box { stroke: #aaa89f; stroke-width: 1.5; rx: 0; }
      .header { fill: #ffffff; }
      .done { fill: #a9d98e; }
      .doing { fill: #ffad76; }
      .todo { fill: #fff2c9; }
      .txt { font-family: Tahoma, "Leelawadee UI", sans-serif; fill: #302d28; text-anchor: middle; dominant-baseline: middle; }
      .owner-text { font-size: 25px; font-weight: 700; }
      .header-text { font-size: 21px; font-weight: 400; }
      .task-text { font-size: 20px; font-weight: 400; }
      .legend-text { font-size: 25px; text-anchor: start; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="2400" height="900"/>
  <rect class="grid" x="0" y="0" width="2400" height="790"/>

  <!-- เจ้าของร้าน -->
  <path class="line" d="M1200 110 V165 M130 165 H2270"/>
  <rect class="box todo" x="1135" y="55" width="130" height="55"/>
  <text class="txt owner-text" x="1200" y="83">เจ้าของร้าน</text>

  <!-- เส้นหลักลงสู่แต่ละหน้า -->
  <path class="line" d="M130 165 V245 M370 165 V245 M610 165 V245 M850 165 V245 M1090 165 V245 M1330 165 V245 M1570 165 V245 M1810 165 V245 M2050 165 V245 M2270 165 V245"/>

  <!-- หน้าแรก(dashboard) -->
  <rect class="box header" x="20" y="245" width="220" height="52"/>
  <text class="txt header-text" x="130" y="271">หน้าแรก(dashboard)</text>
  <path class="line" d="M130 297 V330 H65 V494 M65 353 H82 M65 421 H82 M65 489 H82"/>
  <rect class="box done" x="82" y="330" width="145" height="46"/>
  <text class="txt task-text" x="154.5" y="353">กรองข้อมูล</text>
  <rect class="box done" x="82" y="398" width="145" height="46"/>
  <text class="txt task-text" x="154.5" y="421">ดูสินค้าขายดี</text>
  <rect class="box done" x="82" y="466" width="145" height="46"/>
  <text class="txt task-text" x="154.5" y="489">ดูสินค้าคงคลัง</text>

  <!-- หน้าจอขายหน้าร้าน -->
  <rect class="box header" x="260" y="245" width="220" height="52"/>
  <text class="txt header-text" x="370" y="271">หน้าจอขายหน้าร้าน</text>
  <path class="line" d="M370 297 V330 H305 V562 M305 353 H322 M305 421 H322 M305 489 H322 M305 557 H322"/>
  <rect class="box done" x="322" y="330" width="145" height="46"/>
  <text class="txt task-text" x="394.5" y="353">การชำระเงิน</text>
  <rect class="box done" x="322" y="398" width="145" height="46"/>
  <text class="txt task-text" x="394.5" y="421">พิมพ์ใบเสร็จ</text>
  <rect class="box done" x="322" y="466" width="145" height="46"/>
  <text class="txt task-text" x="394.5" y="489">เพิ่มส่วนลด</text>
  <rect class="box done" x="322" y="534" width="145" height="58"/>
  <text class="txt task-text" x="394.5" y="553">
    <tspan x="394.5" dy="0">ค้นหาเบอร์</tspan>
    <tspan x="394.5" dy="24">สมาชิก</tspan>
  </text>

  <!-- หน้าจัดการสินค้า -->
  <rect class="box header" x="500" y="245" width="220" height="52"/>
  <text class="txt header-text" x="610" y="271">หน้าจัดการสินค้า</text>
  <path class="line" d="M610 297 V330 H545 V698 M545 353 H562 M545 421 H562 M545 489 H562 M545 557 H562 M545 625 H562 M545 693 H562"/>
  <rect class="box done" x="562" y="330" width="145" height="46"/>
  <text class="txt task-text" x="634.5" y="353">เพิ่ม Supplier</text>
  <rect class="box done" x="562" y="398" width="145" height="46"/>
  <text class="txt task-text" x="634.5" y="421">เพิ่มสินค้า</text>
  <rect class="box done" x="562" y="466" width="145" height="46"/>
  <text class="txt task-text" x="634.5" y="489">ค้นหาสินค้า</text>
  <rect class="box done" x="562" y="534" width="145" height="46"/>
  <text class="txt task-text" x="634.5" y="557">เพิ่มสต็อกสินค้า</text>
  <rect class="box done" x="562" y="602" width="145" height="46"/>
  <text class="txt task-text" x="634.5" y="625">แก้ไขสินค้า</text>
  <rect class="box done" x="562" y="670" width="145" height="46"/>
  <text class="txt task-text" x="634.5" y="693">ลบสินค้า</text>

  <!-- หน้าคลังสินค้า -->
  <rect class="box header" x="740" y="245" width="220" height="52"/>
  <text class="txt header-text" x="850" y="271">หน้าคลังสินค้า</text>
  <path class="line" d="M850 297 V330 H785 V562 M785 353 H802 M785 421 H802 M785 489 H802 M785 557 H802"/>
  <rect class="box done" x="802" y="330" width="145" height="46"/>
  <text class="txt task-text" x="874.5" y="353">รับสินค้าเข้าคลัง</text>
  <rect class="box done" x="802" y="398" width="145" height="46"/>
  <text class="txt task-text" x="874.5" y="421">ค้นหาสินค้า</text>
  <rect class="box done" x="802" y="466" width="145" height="46"/>
  <text class="txt task-text" x="874.5" y="489">กรองข้อมูล</text>
  <rect class="box doing" x="802" y="534" width="145" height="70"/>
  <text class="txt task-text" x="874.5" y="555">
    <tspan x="874.5" dy="0">ดูประวัติเคลื่อน</tspan>
    <tspan x="874.5" dy="24">ย้ายสินค้า</tspan>
  </text>

  <!-- หน้าระบบจัดการคำสั่งซื้อ -->
  <rect class="box header" x="972" y="245" width="236" height="52"/>
  <text class="txt header-text" x="1090" y="271">หน้าระบบจัดการคำสั่งซื้อ</text>
  <path class="line" d="M1090 297 V330 H1025 V494 M1025 353 H1042 M1025 421 H1042 M1025 489 H1042"/>
  <rect class="box done" x="1042" y="330" width="145" height="46"/>
  <text class="txt task-text" x="1114.5" y="353">เพิ่มคำสั่งซื้อ</text>
  <rect class="box doing" x="1042" y="398" width="145" height="46"/>
  <text class="txt task-text" x="1114.5" y="421">แก้ไขคำสั่งซื้อ</text>
  <rect class="box done" x="1042" y="466" width="145" height="46"/>
  <text class="txt task-text" x="1114.5" y="489">ลบคำสั่งซื้อ</text>

  <!-- หน้าบัญชีขายเชื่อ -->
  <rect class="box header" x="1220" y="245" width="220" height="52"/>
  <text class="txt header-text" x="1330" y="271">หน้าบัญชีขายเชื่อ</text>
  <path class="line" d="M1330 297 V330 H1265 V494 M1265 353 H1282 M1265 421 H1282 M1265 489 H1282"/>
  <rect class="box done" x="1282" y="330" width="145" height="46"/>
  <text class="txt task-text" x="1354.5" y="353">เพิ่มบัญชีขายเชื่อ</text>
  <rect class="box done" x="1282" y="398" width="145" height="46"/>
  <text class="txt task-text" x="1354.5" y="421">แก้ไขบัญชีขายเชื่อ</text>
  <rect class="box done" x="1282" y="466" width="145" height="46"/>
  <text class="txt task-text" x="1354.5" y="489">ลบบัญชีขายเชื่อ</text>

  <!-- หน้าจัดการบัญชีพนักงาน -->
  <rect class="box header" x="1452" y="245" width="236" height="52"/>
  <text class="txt header-text" x="1570" y="271">หน้าจัดการบัญชีพนักงาน</text>
  <path class="line" d="M1570 297 V330 H1505 V494 M1505 353 H1522 M1505 421 H1522 M1505 489 H1522"/>
  <rect class="box done" x="1522" y="330" width="145" height="46"/>
  <text class="txt task-text" x="1594.5" y="353">เพิ่มพนักงาน</text>
  <rect class="box done" x="1522" y="398" width="145" height="46"/>
  <text class="txt task-text" x="1594.5" y="421">แก้ไขพนักงาน</text>
  <rect class="box done" x="1522" y="466" width="145" height="46"/>
  <text class="txt task-text" x="1594.5" y="489">ลบพนักงาน</text>

  <!-- หน้าตั้งค่า -->
  <rect class="box header" x="1700" y="245" width="220" height="52"/>
  <text class="txt header-text" x="1810" y="271">หน้าตั้งค่า</text>
  <path class="line" d="M1810 297 V330 H1745 V494 M1745 353 H1762 M1745 421 H1762 M1745 489 H1762"/>
  <rect class="box done" x="1762" y="330" width="145" height="46"/>
  <text class="txt task-text" x="1834.5" y="353">โหมดการแสดงผล</text>
  <rect class="box doing" x="1762" y="398" width="145" height="46"/>
  <text class="txt task-text" x="1834.5" y="421">ตั้งค่าเครื่องพิมพ์</text>
  <rect class="box doing" x="1762" y="466" width="145" height="70"/>
  <text class="txt task-text" x="1834.5" y="487">
    <tspan x="1834.5" dy="0">ตั้งค่าเครื่องแสกน</tspan>
    <tspan x="1834.5" dy="24">บาร์โค้ด</tspan>
  </text>

  <!-- แจ้งเตือน -->
  <rect class="box header" x="1940" y="245" width="220" height="52"/>
  <text class="txt header-text" x="2050" y="271">แจ้งเตือน</text>
  <path class="line" d="M2050 297 V330 H1985 V426 M1985 353 H2002 M1985 421 H2002"/>
  <rect class="box done" x="2002" y="330" width="145" height="46"/>
  <text class="txt task-text" x="2074.5" y="353">ดูแจ้งเตือน</text>
  <rect class="box doing" x="2002" y="398" width="145" height="46"/>
  <text class="txt task-text" x="2074.5" y="421">พิมพ์ป้ายลดราคา</text>

  <!-- รายการย้อนหลัง -->
  <rect class="box header" x="2170" y="245" width="210" height="52"/>
  <text class="txt header-text" x="2275" y="271">รายการย้อนหลัง</text>
  <path class="line" d="M2270 297 V330 H2215 V426 M2215 353 H2232 M2215 421 H2232"/>
  <rect class="box doing" x="2232" y="330" width="145" height="46"/>
  <text class="txt task-text" x="2304.5" y="353">ดูแจ้งเตือน</text>
  <rect class="box done" x="2232" y="398" width="145" height="46"/>
  <text class="txt task-text" x="2304.5" y="421">พิมพ์ใบเสร็จ</text>

  <!-- คำอธิบายสี -->
  <circle cx="2035" cy="700" r="23" fill="#a9d98e"/>
  <text class="txt legend-text" x="2085" y="700">หน้าที่ทำเสร็จแล้ว</text>
  <circle cx="2035" cy="770" r="23" fill="#ffad76"/>
  <text class="txt legend-text" x="2085" y="770">หน้าที่กำลังทำ</text>
  <circle cx="2035" cy="840" r="23" fill="#fff2c9"/>
  <text class="txt legend-text" x="2085" y="840">หน้าที่ยังไม่ได้ทำ</text>
</svg>
